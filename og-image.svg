<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07090e"/>
      <stop offset="100%" style="stop-color:#0d111a"/>
    </linearGradient>
    <!-- Violet glow -->
    <radialGradient id="glow1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#07090e;stop-opacity:0"/>
    </radialGradient>
    <!-- Cyan glow -->
    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#07090e;stop-opacity:0"/>
    </radialGradient>
    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="50%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow overlays -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5"/>

  <!-- ── Logo Icon (top-left) ── -->
  <g transform="translate(80, 200)">
    <!-- Icon container -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>
    <rect x="2" y="2" width="68" height="68" rx="17" fill="#090d16"/>
    <!-- Layers icon (stacked polygons) -->
    <polygon points="36,16 16,26 36,36 56,26" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="16,42 36,52 56,42" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="16,34 36,44 56,34" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="80" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">Zevbuild</text>

  <!-- Studio badge pill -->
  <rect x="80" y="338" width="112" height="28" rx="14" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <text x="136" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="2">COMPANY</text>

  <!-- ── Tagline ── -->
  <text x="80" y="408" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="0">Privacy-First Systems &amp; Resilient Digital Products</text>

  <!-- ── Divider ── -->
  <line x1="80" y1="440" x2="560" y2="440" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ── Product pills ── -->
  <!-- ZevSafe -->
  <rect x="80" y="460" width="110" height="30" rx="8" fill="rgba(139,92,246,0.10)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="135" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c4b5fd" text-anchor="middle">ZevSafe</text>

  <!-- ZevSync -->
  <rect x="204" y="460" width="112" height="30" rx="8" fill="rgba(6,182,212,0.10)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <text x="260" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#67e8f9" text-anchor="middle">ZevSync</text>

  <!-- CollegeBus -->
  <rect x="330" y="460" width="118" height="30" rx="8" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <text x="389" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">CollegeBus</text>

  <!-- Kalyan Engine -->
  <rect x="462" y="460" width="138" height="30" rx="8" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.20)" stroke-width="1"/>
  <text x="531" y="480" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">Kalyan Engine</text>

  <!-- ── Right panel — tech attributes ── -->
  <g transform="translate(720, 180)">

    <!-- Attribute 1: Zero-Knowledge -->
    <rect x="0" y="0" width="380" height="72" rx="14" fill="rgba(15,21,37,0.75)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="33" y="43" font-family="Arial" font-size="18" fill="#a78bfa" text-anchor="middle">🔐</text>
    <text x="70" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Zero-Knowledge Core</text>
    <text x="70" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">AES-256-GCM · PBKDF2-SHA512 · WebCrypto</text>

    <!-- Attribute 2: Offline-First -->
    <rect x="0" y="88" width="380" height="72" rx="14" fill="rgba(15,21,37,0.75)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="20" y="108" width="36" height="36" rx="10" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <text x="33" y="131" font-family="Arial" font-size="18" fill="#22d3ee" text-anchor="middle">📡</text>
    <text x="70" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Offline-First Architecture</text>
    <text x="70" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">P2P Bluetooth Mesh · PWA · Service Workers</text>

    <!-- Attribute 3: Zero Surveillance -->
    <rect x="0" y="176" width="380" height="72" rx="14" fill="rgba(15,21,37,0.75)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="20" y="196" width="36" height="36" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="33" y="219" font-family="Arial" font-size="18" fill="#34d399" text-anchor="middle">🛡️</text>
    <text x="70" y="206" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Zero Surveillance</text>
    <text x="70" y="226" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">No cookies · No analytics · No telemetry</text>

    <!-- Attribute 4: Open Source -->
    <rect x="0" y="264" width="380" height="72" rx="14" fill="rgba(15,21,37,0.75)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="20" y="284" width="36" height="36" rx="10" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="33" y="307" font-family="Arial" font-size="18" fill="#fbbf24" text-anchor="middle">⚡</text>
    <text x="70" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Open Source &amp; Auditable</text>
    <text x="70" y="314" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">MIT Licensed · GitHub · Transparent protocols</text>
  </g>

  <!-- ── Bottom URL / domain ── -->
  <text x="80" y="575" font-family="'Courier New', monospace" font-size="15" fill="rgba(139,92,246,0.6)" letter-spacing="1">zevbuild.github.io</text>
  <text x="1120" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(100,116,139,0.7)" text-anchor="end">Privacy-First · Open Source · Goa, India</text>
</svg>
