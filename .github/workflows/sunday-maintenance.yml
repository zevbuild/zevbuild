name: Sunday Maintenance Runner

on:
  schedule:
    # 1. Sunday 12:00 AM IST (Saturday 18:30 UTC): Activate Sunday Maintenance Window
    - cron: '30 18 * * 6'
    # 2. Sunday 12:00 PM IST (Sunday 06:30 UTC): Complete Maintenance & Roll Over to Next Week
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Sunday Maintenance Action'
        required: true
        type: choice
        default: 'enable_maintenance'
        options:
          - 'enable_maintenance'
          - 'rollover_and_resume'

permissions:
  contents: write

jobs:
  sunday-maintenance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/matka/kalyan_4_35_to_6_35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/matka/kalyan_4_35_to_6_35/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sunday Maintenance Workflow
        run: |
          UTC_DOW=$(date -u +%u)
          UTC_HOUR=$(date -u +%H)
          if [ "${{ github.event.inputs.action }}" = "enable_maintenance" ] || ([ "$UTC_DOW" = "6" ] && [ "$UTC_HOUR" -ge 18 ]); then
            echo "[SUNDAY BOT] Activating Sunday Scheduled Maintenance Mode (12:00 AM - 12:00 PM IST)..."
            python sync_and_push.py --no-push --maintenance-on
          else
            echo "[SUNDAY BOT] Concluding Maintenance & Executing Weekly Rollover (12:00 PM IST)..."
            python sync_and_push.py --no-push --sunday-rollover
          fi

      - name: Commit and push changes
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/matka/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            UTC_DOW=$(date -u +%u)
            UTC_HOUR=$(date -u +%H)
            if [ "${{ github.event.inputs.action }}" = "enable_maintenance" ] || ([ "$UTC_DOW" = "6" ] && [ "$UTC_HOUR" -ge 18 ]); then
              git commit -m "chore(maintenance): enable Sunday scheduled maintenance mode (12 AM - 12 PM IST)"
            else
              git commit -m "Sunday Rollover: Update dates & baseline predictions for next week ($(date -u +%Y-%m-%d))"
            fi
            git pull --rebase origin main
            git push origin main
          fi
