name: Matka Auto Update

on:
  schedule:
    # 10:00 PM IST (4:30 PM UTC) daily
    - cron: '30 16 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-matka:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/matka/kalyan_4_35_to_6_35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/matka/kalyan_4_35_to_6_35/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape latest results, train ML models, and sync datasets
        run: python sync_and_push.py --no-push

      - name: Commit and push changes
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/matka/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Kalyan Matka predictions & historical chart ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin main
          fi
