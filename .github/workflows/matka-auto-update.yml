name: Matka Auto Update

on:
  schedule:
    # Mon-Sat Daily Draw & Prediction Sync (7:00 PM IST = 1:30 PM UTC, 10:00 PM IST = 4:30 PM UTC)
    - cron: '30 13 * * 1-6'
    - cron: '30 16 * * 1-6'
    # Sunday Scheduled Maintenance Activator (12:00 AM IST Sunday = 6:30 PM UTC Saturday)
    - cron: '30 18 * * 6'
    # Sunday Weekly Rollover Bot: Updates dates & baseline predictions for next week (12:00 PM IST = 6:30 AM UTC)
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to trigger'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'maintenance_on'
          - 'sunday_rollover'

permissions:
  contents: write

jobs:
  update-matka:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/matka/kalyan_4_35_to_6_35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/matka/kalyan_4_35_to_6_35/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape latest results, train ML models, and sync datasets
        run: |
          UTC_DOW=$(date -u +%u)
          UTC_HOUR=$(date -u +%H)
          if [ "${{ github.event.inputs.action }}" = "maintenance_on" ] || ([ "$UTC_DOW" = "6" ] && [ "$UTC_HOUR" -ge 18 ]); then
            echo "[BOT] Running Sunday Scheduled Maintenance Activator (12 AM to 12 PM IST Maintenance Mode)..."
            python sync_and_push.py --no-push --maintenance-on
          elif [ "${{ github.event.inputs.action }}" = "sunday_rollover" ] || [ "$UTC_DOW" = "7" ]; then
            echo "[BOT] Running Sunday Weekly Rollover Bot (Updating dates & predictions for next week; maintenance complete)..."
            python sync_and_push.py --no-push --sunday-rollover
          else
            echo "[BOT] Running Mon-Sat Daily Sync Bot (Updating draw results & predictions; week dates locked)..."
            python sync_and_push.py --no-push
          fi

      - name: Commit and push changes
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/matka/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            UTC_DOW=$(date -u +%u)
            UTC_HOUR=$(date -u +%H)
            if [ "${{ github.event.inputs.action }}" = "maintenance_on" ] || ([ "$UTC_DOW" = "6" ] && [ "$UTC_HOUR" -ge 18 ]); then
              git commit -m "chore(maintenance): enable Sunday scheduled maintenance mode (12 AM - 12 PM IST)"
            elif [ "${{ github.event.inputs.action }}" = "sunday_rollover" ] || [ "$UTC_DOW" = "7" ]; then
              git commit -m "Sunday Rollover: Update dates & baseline predictions for next week ($(date -u +%Y-%m-%d))"
            else
              git commit -m "Auto-update Kalyan Matka draw results & predictions ($(date -u +%Y-%m-%d))"
            fi
            git pull --rebase origin main
            git push origin main
          fi
