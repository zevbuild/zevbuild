name: Matka Auto Update

on:
  schedule:
    # 11:00 PM IST (5:30 PM UTC) daily
    - cron: '30 17 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-matka:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/matka

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper to fetch latest results
        run: python scraper.py

      - name: Generate predictions
        run: python predict.py

      - name: Sync web directory
        run: |
          cp -f prediction_data.json web/prediction_data.json
          cp -f history.json web/history.json

      - name: Commit and push changes
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/matka/prediction_data.json tools/matka/history.json tools/matka/kalyan_historical_data.csv tools/matka/web/prediction_data.json tools/matka/web/history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Kalyan Matka predictions & historical chart ($(date -u +%Y-%m-%d))"
            git push
          fi
