<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="favStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark rounded container -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#favBg)" stroke="url(#favStroke)" stroke-width="1.5"/>

  <!-- Iconic stacked layers symbol (Zevbuild brand) -->
  <g transform="translate(4, 4)" filter="url(#favGlow)">
    <polygon points="12 2 2 7 12 12 22 7 12 2" fill="none" stroke="url(#favStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="2 17 12 22 22 17" fill="none" stroke="url(#favStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="2 12 12 17 22 12" fill="none" stroke="url(#favStroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
